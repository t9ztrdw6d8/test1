<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PL2303 Seriële Terminal</title>
<style>
  :root { --bg:#f5f6f8; --fg:#1b1f24; --card:#fff; --line:#d6dae0; --acc:#0b5cad; --ok:#1d7a3a; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171b; --fg:#e6e8eb; --card:#1d2126; --line:#333941; --acc:#5aa2f0; --ok:#5cc27a; --err:#f2766d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.2rem; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  select, input, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { background:var(--acc); color:#fff; border:none; cursor:pointer; }
  button:disabled { opacity:.45; }
  #status { font-weight:600; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  #log { height:50vh; overflow:auto; white-space:pre-wrap; word-break:break-all; font:13px/1.35 ui-monospace, Consolas, monospace; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .tx { color:var(--acc); } .sys { opacity:.6; }
  #cmd { flex:1; min-width:0; }
</style>
</head>
<body>
<main>
  <h1>PL2303 Seriële Terminal (WebUSB)</h1>

  <div class="card">
    <div class="row">
      <label>Baud
        <select id="baud">
          <option>1200</option><option>2400</option><option>4800</option>
          <option selected>9600</option><option>19200</option><option>38400</option>
          <option>57600</option><option>115200</option>
        </select>
      </label>
      <label>Pariteit
        <select id="parity"><option value="none">geen</option><option value="even">even</option><option value="odd">oneven</option></select>
      </label>
      <button id="connect">Verbinden</button>
      <button id="disconnect" disabled>Verbreken</button>
    </div>
    <p>Status: <span id="status">niet verbonden</span></p>
  </div>

  <div class="card">
    <div id="log"></div>
    <div class="row" style="margin-top:8px">
      <input id="cmd" placeholder="Commando…" autocomplete="off" autocapitalize="off">
      <select id="eol"><option value="\r">CR</option><option value="\r\n">CR+LF</option><option value="\n">LF</option><option value="">geen</option></select>
      <button id="send" disabled>Verstuur</button>
    </div>
  </div>
</main>

<script type="module">
import { PL2303 } from './pl2303-webusb.js';

const $ = (id) => document.getElementById(id);
const log = $('log');
let port = null;
const dec = new TextDecoder();

function append(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}
function setStatus(text, cls) { $('status').textContent = text; $('status').className = cls || ''; }
function setConnected(on) {
  $('connect').disabled = on; $('disconnect').disabled = !on; $('send').disabled = !on;
}

if (!('usb' in navigator)) {
  setStatus('WebUSB niet beschikbaar — gebruik Chrome/Edge via HTTPS', 'err');
  $('connect').disabled = true;
}

$('connect').onclick = async () => {
  try {
    port = (await PL2303.getPaired()) ?? (await PL2303.request());
    port.onData = (b) => append(dec.decode(b, { stream: true }));
    await port.open({ baudRate: +$('baud').value, parity: $('parity').value });
    const pid = port.device.productId.toString(16).padStart(4, '0');
    setStatus(`verbonden (067b:${pid}${port.isHXN ? ', G-serie' : ''})`, 'ok');
    append(`[verbonden @ ${$('baud').value} baud]\n`, 'sys');
    setConnected(true);
  } catch (e) {
    setStatus(e.message, 'err');
    append(`[fout: ${e.message}]\n`, 'sys');
    port = null;
  }
};

$('disconnect').onclick = async () => {
  try { await port?.close(); } catch (_) {}
  port = null; setConnected(false); setStatus('niet verbonden');
  append('[verbroken]\n', 'sys');
};

async function send() {
  if (!port) return;
  const eol = $('eol').value.replace('\\r', '\r').replace('\\n', '\n');
  const text = $('cmd').value + eol;
  try { await port.write(text); append($('cmd').value + '\n', 'tx'); $('cmd').value = ''; }
  catch (e) { append(`[schrijffout: ${e.message}]\n`, 'sys'); }
}
$('send').onclick = send;
$('cmd').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

navigator.usb?.addEventListener('disconnect', (e) => {
  if (port && e.device === port.device) {
    port = null; setConnected(false); setStatus('adapter losgekoppeld', 'err');
  }
});
</script>
</body>
</html>
